services:
  db:
    image: postgres:16-alpine
    container_name: iso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iso
      POSTGRES_PASSWORD: iso
      POSTGRES_DB: iso
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - iso-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso -d iso"]
      interval: 5s
      timeout: 5s
      retries: 10

  # แปลง Word/Excel → PDF (LibreOffice) สำหรับหน้าดูเอกสารให้เหมือนต้นฉบับ
  # ใช้ฟอนต์จาก Windows เครื่องนี้ (Angsana New, TH Sarabun ฯลฯ) เพื่อให้ระยะ/ตัดคำ/ตัดหน้าตรงกับ Word
  pdf:
    image: gotenberg/gotenberg:8
    container_name: iso-pdf
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=120s", "--libreoffice-restart-after=50"]
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - C:/Windows/Fonts:/usr/local/share/fonts/windows:ro

volumes:
  iso-pgdata:
