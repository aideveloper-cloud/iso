# iso.kgarden.co.th บน DigitalOcean Droplet (Ubuntu + Docker)
# ใช้:  cd /opt/iso/deploy/digitalocean && docker compose --env-file .env up -d --build
# ข้อมูลเอกสาร/เวอร์ชัน/backup อยู่ที่ ${DATA_DIR} บนเครื่อง (ไม่อยู่ใน image)
name: iso

services:
  db:
    image: postgres:16-alpine
    container_name: iso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iso
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ตั้ง DB_PASSWORD ใน .env}
      POSTGRES_DB: iso
      TZ: Asia/Bangkok
    volumes:
      - iso-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso -d iso"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: ../.., dockerfile: deploy/digitalocean/Dockerfile.api }
    container_name: iso-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      API_PORT: "8085"
      CONVERTER_PORT: "8081"
      DOCS_ROOT: /data
      DATABASE_URL: host=db port=5432 user=iso password=${DB_PASSWORD} dbname=iso
      BACKUP_PG_CONTAINER: ""   # pg_dump ต่อฐานข้อมูลตรง (ไม่มี docker ใน container)
      GOTENBERG_URL: http://pdf:3000
      # อีเมลสรุปงานรายวัน (เมนูกระดิ่ง → ตั้งค่าอีเมล) — ไม่ตั้ง SMTP_HOST ใน .env = ปิด ใช้เฉพาะในระบบ
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: https://iso.kgarden.co.th
    volumes:
      - ${DATA_DIR:-/opt/iso/data}:/data

  # converter ใช้ network เดียวกับ api — API เรียก converter ที่ 127.0.0.1:8081 ได้เหมือนบน Windows
  converter:
    build: { context: ../.., dockerfile: deploy/digitalocean/Dockerfile.converter }
    container_name: iso-converter
    restart: unless-stopped
    network_mode: "service:api"
    environment:
      CONVERTER_PORT: "8081"
    volumes:
      - ${DATA_DIR:-/opt/iso/data}:/data:ro   # API ส่ง path ไฟล์มาให้แปลง — ต้องเห็นโฟลเดอร์เดียวกัน

  # แปลง Word/Excel → PDF สำหรับหน้าอ่านเอกสาร (เหมือนต้นฉบับ)
  # ฟอนต์ไทยของเอกสาร (Angsana New ฯลฯ) วางที่ ${FONTS_DIR} — ไม่มีฟอนต์ = LibreOffice ใช้ฟอนต์ทดแทน ระยะ/ตัดหน้าอาจคลาด
  pdf:
    image: gotenberg/gotenberg:8
    container_name: iso-pdf
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=120s", "--libreoffice-restart-after=50"]
    volumes:
      - ${FONTS_DIR:-/opt/iso/fonts}:/usr/local/share/fonts/custom:ro

  web:
    build: { context: ../.., dockerfile: deploy/digitalocean/Dockerfile.web }
    container_name: iso-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      PORT: "8090"
      API_TARGET: http://api:8085
      CONV_TARGET: http://api:8081

  # Cloudflare Tunnel เดิม (iso-kgarden) — ไม่ต้องเปิดพอร์ตเว็บบน Droplet
  # ./cloudflared/ ต้องมี config.yml (จาก config.example.yml) + ไฟล์ credentials <tunnel-id>.json
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: iso-tunnel
    restart: unless-stopped
    depends_on: [web]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro

volumes:
  iso-pgdata:
