[package]
name = "iso-api"
version = "0.3.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] } # ใช้ครั้งเดียวสำหรับ migrate ข้อมูลเก่าจาก SQLite
base64 = "0.22"
chrono = "0.4"

[profile.dev]
opt-level = 0
