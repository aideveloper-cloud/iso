[package]
name = "iso-api"
version = "0.3.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] } # ใช้ครั้งเดียวสำหรับ migrate ข้อมูลเก่าจาก SQLite
base64 = "0.22"
chrono = "0.4"
sha2 = "0.10"
argon2 = "0.5" # แฮช PIN (Argon2id + salt ต่อคน) และสุ่ม token ด้วย OsRng
rand_core = { version = "0.6", features = ["getrandom"] } # เปิด OsRng (CSPRNG ของระบบปฏิบัติการ)
reqwest = { version = "0.12", default-features = false, features = ["multipart"] } # เรียก Gotenberg (แปลง Word/Excel → PDF) ผ่าน HTTP ภายใน
qrcode = { version = "0.14", default-features = false }

[profile.dev]
opt-level = 0
