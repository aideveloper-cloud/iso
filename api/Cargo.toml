[package]
name = "iso-api"
version = "0.3.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
base64 = "0.22"
chrono = "0.4"
sha2 = "0.10"
argon2 = "0.5" # แฮช PIN (Argon2id + salt ต่อคน) และสุ่ม token ด้วย OsRng
rand_core = { version = "0.6", features = ["getrandom"] } # เปิด OsRng (CSPRNG ของระบบปฏิบัติการ)
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] } # เรียก Gotenberg (แปลง Word/Excel → PDF) ผ่าน HTTP ภายใน และ OpenAI (ผู้ช่วย AI) ผ่าน HTTPS
qrcode = { version = "0.14", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls-tls"] } # อีเมลสรุปงานรายวัน (เปิดเมื่อตั้ง SMTP_HOST)
lopdf = { version = "0.42", default-features = false } # ประทับตราสำเนาเอกสาร (เลขสำเนา + QR ตรวจ Rev.) ลงทุกหน้าของ PDF
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] } # อ่านข้อความใน .docx/.xlsx เพื่อตรวจเลข Rev. ในไฟล์
calamine = "0.36" # อ่านข้อความใน .xls (ไบนารีเก่า) เพื่อตรวจเลข Rev. ในไฟล์

[profile.dev]
opt-level = 0
